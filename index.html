<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Un libro para less</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,800;1,500;1,700&display=swap" rel="stylesheet">
<style>
/* Concepto: un libro de scrapbook sobre una mesa vino. Portada roja con marco dorado, páginas crema, rayas, cartas y tiras de fotos. */
:root{
  --wine:#2b0a12; --wine-2:#5e1424;
  --red:#b8141f; --red-2:#8f0f1a;
  --cream:#f7eddc; --paper:#fbf4e6; --ink:#2b1618;
  --gold:#c9a24b; --sage:#47543f; --butter:#f5df7e; --pink:#f4c7cf;
  --display:'Playfair Display',Georgia,serif;
  --hand:'Caveat','Segoe Script',cursive;
  --body:'Lora',Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%;overflow-x:hidden}
body{
  background:radial-gradient(ellipse at 50% 25%,var(--wine-2),var(--wine) 70%);
  color:var(--cream);font-family:var(--body);
  display:flex;flex-direction:column;align-items:center;
  padding-inline:16px;padding-block:14px 10px;min-height:640px;
}
#stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;touch-action:pan-y}
#fit{position:relative}
#scaler{position:absolute;left:0;top:0;transform-origin:0 0}
#book{position:relative;height:560px;transition:transform 1.1s cubic-bezier(.5,.05,.2,1)}
#book.spread{width:840px}
#book.single{width:420px}
#leaves{position:absolute;inset:0;perspective:2600px}
.leaf{position:absolute;top:0;width:420px;height:560px;transform-origin:left center;transform-style:preserve-3d;will-change:transform}
.spread .leaf{left:420px}
.single .leaf{left:0}
.single .face.front{border-radius:2px 10px 10px 2px}
.ready .leaf{transition:transform 1.1s cubic-bezier(.5,.05,.2,1)}
.spread .leaf.flipped{transform:rotateY(-180deg)}
.single .leaf.flipped{transform:rotateY(-180deg);pointer-events:none}

.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);color:var(--ink);padding:44px;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.spread .face.front{border-radius:2px 10px 10px 2px}
.spread .face.back{border-radius:10px 2px 2px 10px}
.face::after{content:'';position:absolute;inset:0;pointer-events:none}
.face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,0) 9%)}
.face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.30),rgba(0,0,0,0) 9%)}
.pn{position:absolute;bottom:16px;font:600 12px var(--body);letter-spacing:.12em;opacity:.55}
.face.front .pn{right:44px}.face.back .pn{left:44px}
.dark{color:var(--cream)}

.hit{position:absolute;top:0;height:560px;width:40px;z-index:3000;cursor:pointer;border:0;background:transparent;padding:0}
.hit.prev{left:0}
.spread .hit.next{left:800px}.single .hit.next{left:380px}
.hit:hover{background:linear-gradient(90deg,rgba(255,255,255,.12),transparent)}
.hit.next:hover{background:linear-gradient(270deg,rgba(255,255,255,.12),transparent)}
.hit:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}

/* tipografía */
h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:34px;line-height:1.1;color:var(--red);margin:0 0 10px;text-wrap:balance}
.hand{font-family:var(--hand);font-weight:700}
.eyebrow{font:600 11px var(--body);letter-spacing:.28em;text-transform:uppercase;margin:0}
p{margin:0}
.body{font-size:15px;line-height:1.7}

/* fotos */
.ph{position:relative;overflow:hidden;background:#cfe6f5;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.empty::after{content:'+ foto';position:absolute;right:6px;bottom:6px;font:600 11px var(--body);background:rgba(255,255,255,.88);color:var(--red-2);padding:2px 8px;border-radius:99px}
.ph:focus-visible{outline:3px solid var(--gold)}

/* portada */
.cover{background:var(--red);color:var(--cream);align-items:center;text-align:center;justify-content:space-between;
  background-image:radial-gradient(circle at 30% 20%,rgba(255,255,255,.10),transparent 55%)}
.cover::before{content:'';position:absolute;inset:16px;border:2px solid var(--gold);pointer-events:none}
.cover::after{box-shadow:inset 0 0 0 7px transparent}
.cover h1{font-family:var(--display);font-style:italic;font-weight:700;font-size:50px;line-height:1.02;margin:0}
.cover .name{font-size:42px;line-height:1;color:var(--butter)}
.frame{background:#fff;padding:9px 9px 9px;box-shadow:0 8px 20px rgba(0,0,0,.35);width:190px;height:220px;transform:rotate(-3deg)}
.frame .ph{width:100%;height:100%}
.cover .foot{font:italic 13px var(--body);opacity:.85}

/* ex libris */
.exlibris{align-items:center;justify-content:center;text-align:center;gap:14px}
.exlibris::before{content:'';position:absolute;inset:22px;border:2px dashed var(--red);border-radius:6px;pointer-events:none}
.exlibris .t{font:600 26px var(--display);letter-spacing:.3em;color:var(--red);margin-left:.3em}
.exlibris .nm{font-size:46px;color:var(--red);border-bottom:2px solid var(--ink);padding:0 14px;line-height:1.1}
.exlibris .q{font:italic 15px/1.6 var(--body);max-width:260px;margin-top:6px}

/* índice */
.toc{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:17px}
.toc li{display:flex;align-items:baseline;gap:8px;font-size:15px}
.toc li i{flex:1;border-bottom:2px dotted rgba(43,22,24,.45);transform:translateY(-4px)}
.toc b{font-family:var(--display);font-weight:600}
.toc .ch{font:600 10px var(--body);letter-spacing:.2em;color:var(--red);text-transform:uppercase;display:block;margin-bottom:1px}

/* rayas */
.stripes-red{background:repeating-linear-gradient(90deg,#c8192a 0 18px,#f7eddc 18px 36px);align-items:center;justify-content:center}
.stripes-sage{background:repeating-linear-gradient(90deg,#4d5a44 0 16px,#3f4a37 16px 32px);align-items:center}
.pill{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:var(--cream);color:var(--red-2);padding:5px 16px;border-radius:99px;font:600 11px var(--body);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.card{position:relative;background:#fff;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.card .rk{position:absolute;font:700 18px/1 var(--display);color:var(--red);text-align:center;z-index:2}
.card .rk.tl{top:9px;left:10px}.card .rk.br{bottom:9px;right:10px;transform:rotate(180deg)}
.card.big{width:268px;height:356px;padding:38px 30px;margin-top:26px}
.card.big .ph{width:100%;height:100%;border-radius:6px}
.card.big .rk{font-size:26px}

/* prólogo */
.prologo .body::first-letter{font:800 52px/0.8 var(--display);float:left;color:var(--red);padding:6px 8px 0 0}
.polaroid{background:#fff;padding:12px 12px 8px;box-shadow:0 8px 18px rgba(0,0,0,.25);width:210px;transform:rotate(3deg);align-self:center;margin-top:22px}
.polaroid .ph{width:100%;aspect-ratio:1}
.polaroid p{font-size:25px;text-align:center;color:var(--red);line-height:1.3}

/* franja roja */
.redpage{background:var(--red);color:var(--cream);align-items:center;justify-content:center;gap:18px;text-align:center}
.redpage h2{font-family:var(--display);font-style:normal;font-weight:800;text-transform:uppercase;color:var(--cream);font-size:29px;line-height:1.05;letter-spacing:.01em}
.strip{background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px;width:152px;transform:rotate(-5deg);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.strip .ph{width:100%;aspect-ratio:4/3}
.spark{font-size:30px;color:var(--butter);position:absolute}

/* 10 cosas */
.cosas{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;counter-reset:c}
.cosas li{counter-increment:c;display:flex;gap:10px;align-items:baseline;font-size:13.5px;line-height:1.35}
.cosas li::before{content:counter(c);font:700 28px/1 var(--hand);color:var(--red);width:26px;flex:none;text-align:right}
.cosas li.t10::before{width:30px}

/* photo booth */
.booth h3{font:700 54px/1 var(--hand);color:var(--cream);margin:2px 0 6px;transform:rotate(-3deg)}
.booth .grid{background:#fff;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;width:250px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.booth .grid .ph{aspect-ratio:1}
.booth .sub{font:italic 600 24px var(--display);margin-top:16px}
.booth .yr{font:600 11px var(--body);letter-spacing:.3em;margin-top:6px;opacity:.8}

/* amarilla */
.yellow{background:var(--butter);justify-content:center;gap:16px}
.yellow h2{font-size:35px;color:var(--red-2)}
.yellow .q{font-size:30px;color:var(--red);line-height:1.1;transform:rotate(-2deg)}
.yellow svg{width:70px;height:auto;align-self:flex-start}

/* páginas para escribir */
.lined{display:flex;flex-direction:column}
.lined .sub{font:italic 14px/1.5 var(--body);margin-bottom:10px;opacity:.85}
.note{flex:1;width:100%;min-height:0;border:0;outline:0;resize:none;background:repeating-linear-gradient(transparent 0 31px,rgba(184,20,31,.28) 31px 32px);
  font:700 24px/32px var(--hand);color:#1c2a66;padding:0;margin:0;overflow:hidden}
.note::placeholder{color:rgba(43,22,24,.42);font-weight:500}
.note:focus{background-color:rgba(245,223,126,.22)}
.lined .fl{display:flex;align-items:baseline;gap:10px;font:600 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--red-2);margin:0 0 9px;flex:none}
.lined .fl .inp,.lined .fl .stars,.lined .fl .opts{flex:1;min-width:0}
.inp{border:0;border-bottom:1.5px solid rgba(43,22,24,.5);background:transparent;outline:0;font:700 22px/1.2 var(--hand);color:#1c2a66;padding:0 2px;letter-spacing:0;text-transform:none;width:100%}
.inp::placeholder{color:rgba(43,22,24,.42);font-weight:500}
.inp:focus{background:rgba(245,223,126,.25)}
.stars{display:flex;gap:2px}
.star{border:0;background:none;font-size:25px;line-height:1;color:rgba(43,22,24,.22);cursor:pointer;padding:0 2px}
.star.on{color:var(--gold)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{font:600 12px var(--body);letter-spacing:0;text-transform:none;border:1.5px solid var(--red);background:transparent;color:var(--red-2);border-radius:99px;padding:3px 11px;cursor:pointer}
.opt.on{background:var(--red);color:var(--cream)}
.star:focus-visible,.opt:focus-visible{outline:2px solid var(--gold)}
.note.short{flex:none;height:98px;margin-bottom:2px}
.stamp{position:absolute;bottom:40px;right:40px;pointer-events:none;z-index:2;border:2.5px solid var(--red);color:var(--red);font:800 12px var(--display);letter-spacing:.2em;text-transform:uppercase;padding:3px 9px;transform:rotate(-8deg);opacity:.8}
.ribbon{position:absolute;top:-4px;right:58px;width:30px;height:110px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}

/* cartas */
.pinkpage{background:repeating-linear-gradient(90deg,#f7d7dc 0 18px,#fbf0ec 18px 36px);align-items:center}
.pinkpage h3{font:700 44px/1 var(--hand);color:var(--red);margin:0 0 20px;transform:rotate(-2deg)}
.hand-grid{display:grid;grid-template-columns:repeat(3,98px);gap:22px 19px}
.hand-grid .card{width:98px;height:137px;padding:20px 10px;border-radius:10px}
.hand-grid .card:nth-child(odd){transform:rotate(-3deg)}.hand-grid .card:nth-child(even){transform:rotate(3deg) translateY(6px)}
.hand-grid .card .rk{font-size:13px}.hand-grid .card .rk.tl{top:5px;left:6px}.hand-grid .card .rk.br{bottom:5px;right:6px}
.hand-grid .ph{width:100%;height:100%;border-radius:3px}

/* felicitación */
.carta{padding-top:50px}
.carta::before{content:'';position:absolute;left:0;right:0;top:0;height:22px;background:radial-gradient(circle at 11px 0,var(--red) 0 8px,transparent 9px) 0 0/22px 22px repeat-x}
.carta h2{margin-bottom:8px;font-size:30px}
.letter{flex:1;min-height:0;overflow:hidden;font:700 24px/1.12 var(--hand);color:#1c2a66}
.letter p+p{margin-top:.55em}
.firma{font:700 30px var(--hand);color:var(--red);text-align:right;margin-top:6px}

/* página de foto final */
.bleedpage{padding:0;justify-content:flex-end;color:#fff}
.bleedpage .ph{position:absolute;inset:0;cursor:pointer}
.bleedpage .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(143,15,26,.92));pointer-events:none}
.bleedpage .txt{position:relative;padding:44px;pointer-events:none}
.bleedpage h2{color:#fff;font-style:normal;font-weight:800;font-size:44px;margin:0 0 6px}
.bleedpage .txt p{font:700 26px var(--hand)}

.fin{align-items:center;justify-content:center;text-align:center;gap:10px}
.fin .big{font:italic 700 74px/1 var(--display);color:var(--red)}
.fin .hand{font-size:28px}
.fin .orn{font-size:22px;color:var(--gold);letter-spacing:.5em}


.music{background:radial-gradient(circle at 50% 0%,#5a1626,#1b080d 72%);color:var(--cream);align-items:center;text-align:center;gap:12px}
.music h2{color:var(--cream);margin:0}
.music .sub{font:italic 14px/1.5 var(--body);opacity:.8}
.vinyl{flex:none;width:124px;height:124px;border-radius:50%;background:repeating-radial-gradient(circle,#0e0e0e 0 2px,#1f1f1f 2px 4px);position:relative;box-shadow:0 8px 20px rgba(0,0,0,.55);animation:spin 9s linear infinite}
.vinyl::after{content:'';position:absolute;inset:37px;border-radius:50%;background:radial-gradient(circle,var(--cream) 0 4px,var(--red) 5px);box-shadow:0 0 0 3px var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
.music iframe{width:100%;height:152px;border:0;border-radius:12px;background:#000;flex:none}
.spcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#2c1018;border:1px solid rgba(247,237,220,.2);border-radius:12px;padding:12px}
.spcard .art{flex:none;width:62px;height:62px;border-radius:6px;background:var(--red);display:grid;place-items:center;font-size:28px;color:var(--cream)}
.spcard b{display:block;font:700 15px/1.25 var(--display)}
.spcard small{opacity:.7;font-size:12px}
.splink{display:inline-block;background:#1db954;color:#07240f;font:700 13px var(--body);padding:8px 20px;border-radius:99px;text-decoration:none}
.splink:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.cakepage{align-items:center;text-align:center;padding-top:58px;gap:6px}
.bunting{position:absolute;left:0;top:0;width:100%;height:40px}
.cakepage h2{margin:0}
.cake{width:272px;height:auto;flex:none}
.cakepage .wish{font-size:25px;line-height:1.1;color:var(--red-2);min-height:56px;max-width:300px}
.blow{font:700 14px var(--body);color:var(--cream);background:var(--red);border:0;border-radius:99px;padding:9px 22px;cursor:pointer}
.blow:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.smoke{opacity:0;transform-box:fill-box}
.blown .flame{display:none}
.blown .smoke{animation:smoke 1.8s ease-out}
@keyframes smoke{from{opacity:.8;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-34px) scale(1.8)}}
.fx{position:absolute;left:0;top:0;width:420px;height:560px;pointer-events:none;z-index:6}
.boom{position:absolute;left:50%;top:40%;z-index:7;font:800 56px/1 var(--display);font-style:italic;color:var(--red);text-shadow:0 3px 0 #fff,0 0 24px rgba(245,223,126,.95);white-space:nowrap;pointer-events:none;animation:boom 2.2s ease-out forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.1) rotate(-14deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.4) rotate(-6deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(-6deg)}80%{opacity:1}100%{transform:translate(-50%,-110%) scale(1.05) rotate(-6deg);opacity:0}}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 55%,rgba(255,240,170,.95),transparent 68%);animation:flash .9s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.balloon{position:absolute;bottom:-110px;width:44px;height:56px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;z-index:5;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.6) 0 9%,transparent 10%),var(--c);box-shadow:inset -6px -8px 10px rgba(0,0,0,.18);
  animation:rise var(--d) cubic-bezier(.3,.6,.4,1) var(--w) forwards}
.balloon::after,.bln::after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:30px;background:rgba(43,22,24,.45)}
.balloon::before,.bln::before{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:7px solid var(--c)}
@keyframes rise{0%{transform:translateX(0) rotate(-4deg)}25%{transform:translate(16px,-190px) rotate(5deg)}50%{transform:translate(-16px,-380px) rotate(-5deg)}75%{transform:translate(16px,-570px) rotate(4deg)}100%{transform:translate(0,-780px) rotate(-3deg)}}
.emo{position:absolute;bottom:70px;font-size:28px;z-index:5;pointer-events:none;opacity:0;animation:emo var(--d) ease-out var(--w) forwards}
@keyframes emo{0%{opacity:0;transform:translateY(0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),-400px) scale(1.4) rotate(var(--r))}}
.cake.bounce{animation:bounce .9s ease-out}
@keyframes bounce{0%{transform:scale(1)}20%{transform:scale(1.14,.9)}40%{transform:scale(.94,1.1)}60%{transform:scale(1.05,.97)}80%{transform:scale(.99,1.02)}100%{transform:scale(1)}}

/* carta tapada con globos */
.carta .bhint{font:italic 14px/1.4 var(--body);margin:0 0 8px;color:var(--red-2)}
.carta .bhint b{font-style:normal;font-variant-numeric:tabular-nums;margin-left:4px}
.reveal{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.veil{position:absolute;inset:-6px -8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);z-index:2;pointer-events:none}
.tile{position:relative;background:var(--paper);display:grid;place-items:center}
.tile.open{opacity:0;visibility:hidden;transition:opacity .7s .15s,visibility 0s .85s}
.tile.open .bln{display:none}
.bln{pointer-events:auto;position:relative;width:70px;height:88px;border:0;padding:0;cursor:pointer;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.65) 0 9%,transparent 10%),var(--c);box-shadow:inset -8px -10px 14px rgba(0,0,0,.2);
  transform:translate(var(--dx),var(--dy)) rotate(var(--r));animation:bob 3s ease-in-out infinite;animation-delay:calc(var(--k) * -.37s)}
.bln:hover{filter:brightness(1.1)}
.bln:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@keyframes bob{from{transform:translate(var(--dx),calc(var(--dy) - 4px)) rotate(var(--r))}to{transform:translate(var(--dx),calc(var(--dy) + 4px)) rotate(calc(var(--r) + 4deg))}}
.bln.pop{animation:pop .26s ease-out forwards;pointer-events:none}
@keyframes pop{0%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1)}45%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.3)}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.7);opacity:0}}
.breset{position:absolute;left:44px;bottom:12px;z-index:3;border:0;background:none;font:italic 12px var(--body);color:var(--red-2);cursor:pointer;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){.bln,.balloon,.emo,.boom{animation-duration:.01s!important}}
@media (prefers-reduced-motion:reduce){.vinyl,.flame{animation:none}}

/* barra inferior */
#bar{display:flex;align-items:center;gap:12px;justify-content:center;padding-top:10px;flex-wrap:wrap}
#bar button{font:600 14px var(--body);color:var(--cream);background:transparent;border:1.5px solid rgba(247,237,220,.45);border-radius:99px;padding:8px 18px;cursor:pointer}
#bar button:hover:not(:disabled){background:rgba(247,237,220,.12)}
#bar button:disabled{opacity:.35;cursor:default}
#bar button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#where{min-width:130px;text-align:center;font:600 13px var(--body);letter-spacing:.06em;font-variant-numeric:tabular-nums}
#hint{font:italic 12.5px var(--body);opacity:.7;text-align:center;margin-top:8px;max-width:520px}
#file{display:none}
@media (prefers-reduced-motion:reduce){#book,.ready .leaf{transition-duration:.01s!important;transition-delay:0s!important}}
</style></head><body>

<main id="stage" aria-label="Libro de cumpleaños">

const rnd = (a, b) => a + Math.random() * (b - a);
function fxOf(page) {
  if (page._fx) return page._fx;
  const cv = document.createElement('canvas'); cv.className = 'fx'; cv.width = 840; cv.height = 1120; page.appendChild(cv);
  return (page._fx = { ctx: cv.getContext('2d'), parts: [], on: false });
}
function emit(page, x, y, ang, spread, spd, n, cols, o = {}) {
  const fx = fxOf(page);
  for (let i = 0; i < n; i++) {
    const a = ang + (Math.random() - .5) * spread, s = spd * (.45 + Math.random() * .75), q = Math.random();
    fx.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .5,
      w: o.w || rnd(5, 10), h: o.h || rnd(8, 16), c: cols[i % cols.length], k: q < .18 ? 'c' : (q < .3 ? 'r' : 's'), g: o.g || .3, t: 0, max: o.max || 200 });
  }
  if (!fx.on) { fx.on = true; requestAnimationFrame(() => tick(fx)); }
}
function tick(fx) {
  const ctx = fx.ctx, parts = fx.parts;
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, 420, 560);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t++; p.vy += p.g; p.vx *= .992; p.vy *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if (p.t > p.max || p.y > 610) { parts.splice(i, 1); continue; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.min(1, (p.max - p.t) / 40); ctx.fillStyle = p.c;
    if (p.k === 'c') { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.283); ctx.fill(); }
    else if (p.k === 'r') ctx.fillRect(-1.5, -p.h * 1.6, 3, p.h * 3.2);

    ctx.restore();

  if (parts.length) requestAnimationFrame(() => tick(fx)); else { fx.on = false; ctx.clearRect(0, 0, 420, 560); }
}
function drop(page, el, ms) { page.appendChild(el); setTimeout(() => el.remove(), ms); return el; }

    drop(page, e, 6000);

    document.querySelectorAll('textarea.note').forEach(ta => {
      const id = ta.dataset.id;
      ta.placeholder = CONFIG.ejemplos[id] || '';
      ta.value = notes[id] || '';
    });
    document.querySelectorAll('input.inp').forEach(inp => {
      inp.placeholder = CONFIG.ejemplos[inp.dataset.id] || '';
      inp.value = notes[inp.dataset.id] || '';
    });
    document.querySelectorAll('.cakepage').forEach(c => {
      c.classList.toggle('blown', blown);
      c.querySelector('.blow').textContent = blown ? 'Volver a encender' : 'Soplar las velas';
      c.querySelector('.wish').textContent = blown ? '¡Listo! Ahora guarda el secreto. Bueno, cuéntamelo.' : 'Pide un deseo y no se lo cuentes a nadie. Bueno, a mí sí.';
    });
    updateReveal();
    document.querySelectorAll('.stars').forEach(s => {
      const v = +notes[s.dataset.id] || 0;
      s.querySelectorAll('.star').forEach(b => b.classList.toggle('on', +b.dataset.v <= v));
    });
    document.querySelectorAll('.opts').forEach(o => {
      o.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', notes[o.dataset.id] === b.dataset.v));
    });
  }
  const anyEmpty = document.querySelector('.ph.empty');
  document.getElementById('hint').textContent =
    'Toca las líneas para escribir; se guarda en este dispositivo.' + (anyEmpty ? ' Faltan fotos: ponlas en la carpeta «libro» como 1.jpg, 2.jpg … 10.jpg.' : '');
}

function fitLetter() {
  document.querySelectorAll('.letter').forEach(el => {
    let fs = 25; el.style.fontSize = fs + 'px';
    while (el.scrollHeight > el.clientHeight + 1 && fs > 13) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
  });
}

function fit() {
  const w = single ? PW : PW * 2;
  const availW = innerWidth - 32;
  const availH = Math.max(innerHeight - 110, 420);
  scale = Math.min(availW / w, availH / PH, 1.4);
  fitEl.style.width = (w * scale) + 'px';
  fitEl.style.height = (PH * scale) + 'px';
  scaler.style.transform = `scale(${scale})`;
}

function applyZ() {
  leafEls.forEach((l, i) => { if (!l._fl) l.style.zIndex = i < cur ? i : units.length - i; });
}

function render(animate) {
  leafEls.forEach((l, i) => {
    const should = i < cur;
    if (l.classList.contains('flipped') === should) return;
    l.classList.toggle('flipped', should);
    clearTimeout(l._t);
    if (animate) {
      /* la hoja en movimiento se queda arriba hasta terminar su propia vuelta */
      l._fl = true;
      l.style.zIndex = 900 + (should ? units.length - i : i);
      l._t = setTimeout(() => { l._fl = false; applyZ(); }, 1200);
    } else l._fl = false;
  });
  applyZ();
  const L = units.length;
  let shift = 0;
  if (!single) shift = cur === 0 ? -PW / 2 : (cur === L ? PW / 2 : 0);
  book.style.transform = `translateX(${shift}px)`;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur >= maxCur();
  document.getElementById('hitPrev').hidden = cur === 0;
  document.getElementById('hitNext').hidden = cur >= maxCur();
  let t;
  if (cur === 0) t = 'Portada';
  else if (single) t = cur === TOTAL ? 'Fin' : `Página ${cur} de ${TOTAL - 1}`;
  else t = cur === L ? 'Fin' : `Páginas ${2 * cur - 1}–${2 * cur} de ${TOTAL - 1}`;
  document.getElementById('where').textContent = t;
}

function go(d) {
  const n = Math.max(0, Math.min(maxCur(), cur + d));
  if (n === cur) return;
  cur = n; render(true);
}

/* ===== eventos ===== */
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('hitPrev').onclick = () => go(-1);
document.getElementById('hitNext').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (/TEXTAREA|INPUT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

let sx = null, sy = 0;
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => { if (e.target.closest('textarea')) { sx = null; return; } sx = e.clientX; sy = e.clientY; });
stage.addEventListener('pointerup', e => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 60) go(dx < 0 ? 1 : -1);
});

leavesEl.addEventListener('input', e => {
  if (!e.target.matches('textarea.note, input.inp')) return;
  notes[e.target.dataset.id] = e.target.value; saveNotes();
});
leavesEl.addEventListener('click', e => {
  const bl = e.target.closest('.blow');
  if (bl) {
    blown = !blown; hydrate();
    if (blown) celebrate(bl.closest('.cakepage'));
    return;
  }
  const bln = e.target.closest('.bln');
  if (bln) {
    const k = +bln.dataset.k; if (popped.has(k)) return;
    popped.add(k); savePopped(); bln.classList.add('pop'); popAt(bln);
    setTimeout(updateReveal, 230);
    if (popped.size >= NGLOBOS) { const pg = bln.closest('.face'); setTimeout(() => { cannons(pg); setTimeout(() => emit(pg, 210, 0, Math.PI / 2, 2.6, 3.2, 90, CONF, { g: .1, max: 280 }), 400); }, 500); }
    return;
  }
  if (e.target.closest('.breset')) {
    popped.clear(); savePopped();
    document.querySelectorAll('.bln').forEach(x => x.classList.remove('pop'));
    updateReveal(); return;
  }
  const b = e.target.closest('.star, .opt');
  if (!b) return;
  const wrap = b.parentElement, id = wrap.dataset.id;
  if (b.classList.contains('star')) notes[id] = (+notes[id] === +b.dataset.v) ? 0 : +b.dataset.v;
  else notes[id] = b.dataset.v;
  saveNotes(); hydrate();
});

const file = document.getElementById('file');
let pickN = null;
function pick(el) { pickN = el.dataset.n; file.value = ''; file.click(); }
leavesEl.addEventListener('click', e => { const p = e.target.closest('.ph'); if (p) pick(p); });
leavesEl.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.ph')) { e.preventDefault(); pick(e.target); } });
file.addEventListener('change', () => {
  const f = file.files && file.files[0]; if (!f || !pickN) return;
  const r = new FileReader();
  r.onload = () => { photos[pickN] = r.result; hydrate(pickN); document.getElementById('hint').textContent = 'Toca las líneas para escribir; se guarda en este dispositivo.' + (document.querySelector('.ph.empty') ? ' Faltan fotos: ponlas en la carpeta «libro» como 1.jpg, 2.jpg … 10.jpg.' : ''); };
  r.readAsDataURL(f);
});

let lastSingle = null;
function onResize() {
  const s = innerWidth < 760;
  if (s !== single) {
    const prevCur = cur;
    if (s) cur = prevCur === 0 ? 0 : Math.min(2 * prevCur, TOTAL);
    else cur = prevCur === 0 ? 0 : Math.ceil(prevCur / 2);
    build();
    render(false);
    fitLetter();
  }
  fit();
}
addEventListener('resize', onResize);


/* ===== fotos desde la misma carpeta: 1.jpg ... 10.jpg ===== */
function autoFotos() {
  const exts = ['jpg','jpeg','png','webp','JPG','JPEG','PNG','WEBP'];
  for (let n = 1; n <= 10; n++) {
    if (photos[n]) continue;
    const cand = [];
    ['libro/', ''].forEach(d => [String(n), 'foto' + n, 'Foto' + n].forEach(b => exts.forEach(x => cand.push(`${d}${b}.${x}`))));
    (function probe(i) {
      if (i >= cand.length) return;
      const im = new Image();
      im.onload = () => { photos[n] = cand[i]; hydrate(n); };
      im.onerror = () => probe(i + 1);
      im.src = cand[i];
    })(0);
  }
}

build(); fit(); render(false); fitLetter(); autoFotos();
requestAnimationFrame(() => requestAnimationFrame(() => book.classList.add('ready')));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLetter);
</script>
</body></html>
